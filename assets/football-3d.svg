<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <!-- Turf lighting gradient -->
    <radialGradient id="turfGlow" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#047857" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
    <!-- Ball spherical shadow & 3D gradient -->
    <radialGradient id="ballShade" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
    <!-- Drop shadow underneath ball -->
    <radialGradient id="ballGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Turf Base Glow & Grass Shadow -->
  <ellipse cx="115" cy="138" rx="80" ry="18" fill="url(#turfGlow)" />
  <ellipse cx="112" cy="135" rx="58" ry="14" fill="url(#ballGroundShadow)" />

  <!-- Grass Blades on Turf -->
  <g fill="#059669" opacity="0.8">
    <path d="M60 148 Q 58 132 64 126 Q 66 136 67 148 Z" />
    <path d="M72 150 Q 75 130 82 122 Q 80 135 79 150 Z" fill="#10b981" />
    <path d="M90 152 Q 88 135 94 128 Q 97 138 98 152 Z" />
    <path d="M125 152 Q 130 134 136 127 Q 133 140 132 152 Z" fill="#34d399" />
    <path d="M140 150 Q 146 132 154 125 Q 148 138 147 150 Z" />
    <path d="M158 148 Q 163 133 170 128 Q 166 140 164 148 Z" fill="#10b981" />
  </g>

  <!-- 3D Soccer Ball Sphere -->
  <g id="soccerBall">
    <!-- Base Sphere -->
    <circle cx="110" cy="85" r="54" fill="url(#ballShade)" />

    <!-- Pentagons & Leather Seams (Classic Telstar pattern) -->
    <!-- Center Pentagon -->
    <polygon points="108,62 124,73 118,92 98,92 92,73" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Top Patch -->
    <polygon points="108,62 110,40 126,38 132,54 124,73" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" opacity="0.9" />
    <polygon points="108,40 108,31 92,34 94,52 108,62" fill="#0f172a" stroke="#020617" stroke-width="1.5" />

    <!-- Left Patches -->
    <polygon points="92,73 74,78 78,98 98,92" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" opacity="0.9" />
    <polygon points="74,78 60,68 62,54 78,56 92,73" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Right Patches -->
    <polygon points="124,73 144,72 148,90 134,102 118,92" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" opacity="0.9" />
    <polygon points="144,72 158,62 162,76 154,92 148,90" fill="#0f172a" stroke="#020617" stroke-width="1.5" />

    <!-- Bottom Patches -->
    <polygon points="98,92 102,112 114,112 118,92" fill="#0f172a" stroke="#020617" stroke-width="1.5" />
    <polygon points="98,92 78,98 84,116 102,112" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" />
    <polygon points="118,92 134,102 128,118 114,112" fill="#94a3b8" stroke="#475569" stroke-width="1.2" />

    <!-- Rim Shade & Specular Highlight -->
    <circle cx="110" cy="85" r="54" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="3" />
    <ellipse cx="96" cy="65" rx="22" ry="14" fill="#ffffff" opacity="0.35" transform="rotate(-25 96 65)" />
    <circle cx="92" cy="58" r="6" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Foreground Grass Blades Overlapping Ball -->
  <g fill="#10b981">
    <path d="M85 142 Q 92 124 88 116 Q 96 128 95 142 Z" />
    <path d="M102 145 Q 106 126 112 118 Q 110 132 108 145 Z" fill="#34d399" />
    <path d="M120 144 Q 124 128 118 120 Q 126 130 126 144 Z" />
  </g>
</svg>
