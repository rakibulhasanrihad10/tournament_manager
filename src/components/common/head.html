  <script>
    // Immediate pre-render theme setup to prevent Flash of Incorrect Theme (FOIT)
    (function() {
      try {
        const savedTheme = localStorage.getItem('tournament_theme_mode');
        const systemLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        const theme = savedTheme || (systemLight ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);

        // Always enforce White Paper sheet theme permanently
        document.documentElement.classList.add('sheet-theme-paper');
      } catch (e) {}
    })();
  </script>
