    <div class="action-bar">
      <div class="action-bar-inner">
        <div class="action-bar-brand">
          <!-- Return to Sports Hub Button -->
          <button type="button" class="btn btn-hub" onclick="navigateToView('hub')" data-i18n="nav.btn_hub" title="স্পোর্টস হাব / হোম পেজে ফিরে যান">🏠 স্পোর্টস হাব</button>
          <div class="action-bar-title-wrap">
            <h2 data-i18n="nav.panel_title">টুর্নামেন্ট ম্যানেজমেন্ট প্যানেল</h2>
          </div>
        </div>
        <div class="action-btns">
          <!-- 1. Primary Highlighted Setup / Edit CTA -->
          <button type="button" class="btn btn-primary-wizard" id="btn-nav-wizard" onclick="openTournamentWizard()" data-i18n="nav.btn_wizard" data-i18n-title="nav.btn_wizard_title" title="টুর্নামেন্টের তথ্য, দল, ফরম্যাট ও নিয়মাবলী এডিট করুন">
            ✏️ এডিট টুর্নামেন্ট
          </button>

          <!-- 2. Consolidated Print & Paper Sheets Dropdown -->
          <div class="dropdown-wrap" id="print-dropdown-wrap">
            <button type="button" class="btn btn-dropdown" onclick="toggleDropdown('print-dropdown')" id="btn-print-dropdown" data-i18n-title="nav.dropdown_print_title" title="মাঠের স্কোরশিট, প্লেয়ার ফর্ম ও টুর্নামেন্ট শিট প্রিন্ট করুন">
              <span data-i18n="nav.dropdown_print">🖨️ প্রিন্ট</span> <span class="dropdown-caret">▾</span>
            </button>
            <div class="dropdown-menu" id="print-dropdown">
              <button type="button" class="dropdown-item" onclick="printDocument('summary'); closeAllDropdowns();" id="btn-print-tournament-summary">
                <span class="item-icon">🏆</span>
                <div>
                  <strong data-i18n="nav.print_summary_title">টুর্নামেন্ট চূড়ান্ত ফলাফল ও সমাপ্তি শিট</strong>
                  <small data-i18n="nav.print_summary_sub">পয়েন্ট টেবিল, সব ম্যাচের স্কোর, চ্যাম্পিয়ন দল ও বিশেষ পুরস্কার</small>
                </div>
              </button>
              <div class="dropdown-divider"></div>
              <button type="button" class="dropdown-item" onclick="printDocument('blank-scoresheet'); closeAllDropdowns();" id="btn-print-blank-scoresheet">
                <span class="item-icon">📊</span>
                <div>
                  <strong data-i18n="nav.print_blank_scoresheet">মাঠের স্কোরশিট (খাতা-কলমে লেখার ফাঁকা শিট)</strong>
                  <small data-i18n="nav.print_blank_scoresheet_sub">মাঠে বসে হাতে স্কোর লেখার জন্য ফাঁকা ফিকশ্চার</small>
                </div>
              </button>
              <button type="button" class="dropdown-item" onclick="openBlankRosterConfigModal(); closeAllDropdowns();" id="btn-print-blank-roster">
                <span class="item-icon">📝</span>
                <div>
                  <strong data-i18n="nav.print_blank_roster">খালি প্লেয়ার নিবন্ধন ফর্ম</strong>
                  <small data-i18n="nav.print_blank_roster_sub">দলের নাম ও খেলোয়াড় তালিকা হাতে লেখার ব্ল্যাঙ্ক শিট</small>
                </div>
              </button>
            </div>
          </div>

          <!-- 3. Unified Social Media & Promotion Hub (1-Click) -->
          <button type="button" class="btn btn-dropdown" onclick="openPromoPosterModal('promo')" id="btn-social-dropdown" data-i18n-title="nav.btn_social_hub_title" title="সোশ্যাল মিডিয়া প্রচার ও শেয়ারিং হাব">
            <span data-i18n="nav.dropdown_social">📢 সোশ্যাল মিডিয়ায় প্রচার</span>
          </button>

          <!-- 4. Consolidated Settings & Utilities Dropdown -->
          <div class="dropdown-wrap" id="tools-dropdown-wrap">
            <button type="button" class="btn btn-dropdown" onclick="toggleDropdown('tools-dropdown')" id="btn-tools-dropdown" data-i18n-title="nav.dropdown_tools_title" title="সিস্টেম সেটিংস ও ডাটা ইউটিলিটি">
              <span data-i18n="nav.dropdown_tools">⚙️ সেটিংস</span> <span class="dropdown-caret">▾</span>
            </button>
            <div class="dropdown-menu" id="tools-dropdown">
              <!-- Demo Data -->
              <button type="button" class="dropdown-item" onclick="loadSampleTournamentData(); closeAllDropdowns();">
                <span class="item-icon">⚡</span>
                <div>
                  <strong data-i18n="nav.btn_demo">ডেমো ডাটা লোড করুন</strong>
                  <small data-i18n="nav.demo_sub">নমুনা স্কোর ও দল দিয়ে টেস্ট করুন</small>
                </div>
              </button>
              <div class="dropdown-divider"></div>
              <!-- Reset Tournament Data -->
              <button type="button" class="dropdown-item dropdown-item-danger" onclick="resetTournamentData(); closeAllDropdowns();">
                <span class="item-icon">🔄</span>
                <div>
                  <strong data-i18n="nav.btn_reset">সব ডাটা রিসেট করুন</strong>
                  <small data-i18n="nav.reset_sub">নতুন করে শুরু করার জন্য সব মুছুন</small>
                </div>
              </button>
            </div>
          </div>

          <!-- 5. Language & Theme Utilities -->
          <div class="nav-utilities">
            <!-- Language Switcher Pill Toggle -->
            <div class="lang-switch-wrap" title="Switch Language / ভাষা পরিবর্তন করুন">
              <button type="button" class="lang-btn lang-btn-bn active" id="btn-lang-bn" onclick="setLanguage('bn')">বাং</button>
              <button type="button" class="lang-btn lang-btn-en" id="btn-lang-en" onclick="setLanguage('en')">EN</button>
            </div>

            <!-- App System Color Mode Switcher (Dark / Light) -->
            <div class="theme-switch-wrap" title="App UI Color Mode / অ্যাপের কালার মোড (ডার্ক/লাইট)" data-i18n-title="nav.theme_title">
              <button type="button" class="theme-btn theme-btn-dark active" id="btn-theme-dark" onclick="setAppTheme('dark')" title="ডার্ক মোড (Dark Mode)" data-i18n-title="nav.theme_dark">🌙</button>
              <button type="button" class="theme-btn theme-btn-light" id="btn-theme-light" onclick="setAppTheme('light')" title="লাইট মোড (Light Mode)" data-i18n-title="nav.theme_light">☀️</button>
            </div>
          </div>
        </div>
      </div>
    </div>
