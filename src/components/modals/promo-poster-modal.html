  <div id="promo-poster-modal" class="modal-backdrop" onclick="if(event.target === this) closePromoPosterModal()">
    <div class="modal-box modal-promo">
      <div class="modal-header" style="background: linear-gradient(90deg, #0f172a, #0284c7);">
        <h3 data-i18n="poster.modal_unified_title">📢 সোশ্যাল মিডিয়া প্রচার ও শেয়ারিং হাব</h3>
        <button type="button" class="modal-close-btn" onclick="closePromoPosterModal()">✕</button>
      </div>

      <!-- 3-Stage Lifecycle Stepper Navigation Tabs -->
      <div class="poster-modal-tabs social-lifecycle-tabs">
        <button type="button" class="poster-tab-btn active" id="tab-btn-poster-promo" onclick="switchPosterTab('promo')">
          <span class="stage-step-badge">১</span>
          <div class="tab-txt-col">
            <strong class="tab-main-txt" data-i18n="poster.tab_promo">📢 টুর্নামেন্ট নোটিশ ও প্রচার</strong>
            <small class="tab-sub-txt" data-i18n="poster.tab_stage1_sub">টুর্নামেন্টের শুরুতে (দল আহ্বান)</small>
          </div>
        </button>
        <button type="button" class="poster-tab-btn" id="tab-btn-poster-fixture" onclick="switchPosterTab('fixture')">
          <span class="stage-step-badge">২</span>
          <div class="tab-txt-col">
            <strong class="tab-main-txt" data-i18n="poster.tab_fixture">🗓️ ম্যাচ ফিক্সচার ও সময়সূচি</strong>
            <small class="tab-sub-txt" data-i18n="poster.tab_stage2_sub">দল নিবন্ধন শেষে (খেলার সূচি)</small>
          </div>
        </button>
        <button type="button" class="poster-tab-btn" id="tab-btn-poster-results" onclick="switchPosterTab('results')">
          <span class="stage-step-badge">৩</span>
          <div class="tab-txt-col">
            <strong class="tab-main-txt" data-i18n="poster.tab_stage3_title">🏆 পয়েন্ট টেবিল ও ফলাফল (PNG)</strong>
            <small class="tab-sub-txt" data-i18n="poster.tab_stage3_sub">খেলা চলাকালীন বা শেষে (ছবি ডাউনলোড)</small>
          </div>
        </button>
      </div>

      <!-- Top Poster Action Bar -->
      <div class="modal-promo-action-bar" style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#f8fafc; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; gap:6px;">
        <span class="modal-promo-subtitle" style="font-size:11px; font-weight:700; color:#334155;" data-i18n="poster.fixture_sub">নিবন্ধিত সকল দলের অফিশিয়াল খেলার সূচি ও নকআউট রোডম্যাপ</span>
        <div style="display:flex; gap:6px;">
          <button type="button" class="btn" id="btn-poster-branding-setup" style="background:linear-gradient(135deg, #0284c7, #0369a1); color:#fff; font-size:11px; padding:5px 10px; font-weight:700;" onclick="openBlankRosterConfigModal()" data-i18n="poster.btn_branding_setup" title="পোস্টারের স্টেডিয়াম কভার ও লোগো পরিবর্তন করুন">🏟️ কভার ও লোগো</button>
          <button type="button" class="btn" id="btn-poster-copy-action" style="background:linear-gradient(135deg, #1e40af, #2563eb); color:#fff; font-size:11px; padding:5px 10px;" onclick="copyFacebookFixturePost()" data-i18n="modal.btn_copy_fixture">📋 ফিক্সচার পোস্ট কপি করুন</button>
          <button type="button" class="btn" id="btn-poster-print-action" style="background:linear-gradient(135deg, #15803d, #16a34a); color:#fff; font-size:11px; padding:5px 10px;" onclick="downloadSocialCard('fixtures', this)" data-i18n="poster.btn_download_png">📸 ফিক্সচার ছবি ডাউনলোড (PNG)</button>
        </div>
      </div>

      <div class="modal-body" style="max-height:75vh; overflow-y:auto; padding:12px;">
        <!-- Live Poster Preview Container -->
        <div id="promo-poster-render-target"></div>
      </div>

      <div class="modal-promo-footer-bar" style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#f8fafc; border-top:1px solid #e2e8f0; flex-wrap:wrap; gap:8px;">
        <div class="modal-promo-tip" style="font-size:11px; color:#475569;" data-i18n="poster.social_img_tip">💡 টিপস: "📸 ছবি ডাউনলোড (PNG)" বাটনে ক্লিক করে সরাসরি ফেসবুক ও হোয়াটসঅ্যাপে পোস্ট করার উপযোগী হাই-রেজোলিউশন ছবি নামিয়ে নিন।</div>
        <button type="button" class="btn" style="background:#0f172a; color:#fff;" onclick="closePromoPosterModal()" data-i18n="modal.btn_close_done">বন্ধ করুন ✕</button>
      </div>
    </div>
  </div>
